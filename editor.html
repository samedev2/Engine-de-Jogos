<!doctype html>
<html lang="pt-br">
<head>
<meta charset="UTF-8" />
<title>Editor de Sprites</title>
<style>
  body { margin: 0; background: #1e1e1e; color: #eee; font-family: sans-serif; display: flex; height: 100vh; }
  #sidebar { width: 220px; padding: 12px; background: #252525; display: flex; flex-direction: column; gap: 12px; box-sizing: border-box; }
  #canvasWrap { flex: 1; display: flex; align-items: center; justify-content: center; }
  canvas { image-rendering: pixelated; border: 1px solid #444; cursor: crosshair; }
  .palette { display: grid; grid-template-columns: repeat(8, 1fr); gap: 4px; }
  .swatch { width: 20px; height: 20px; border: 1px solid #555; cursor: pointer; }
  .swatch.selected { outline: 2px solid #fff; }
  button, input[type=number] { background: #333; color: #eee; border: 1px solid #555; padding: 6px; border-radius: 4px; cursor: pointer; width: 100%; box-sizing: border-box; }
  a { color: #7fd; }
  label { font-size: 12px; display: flex; flex-direction: column; gap: 4px; }
</style>
</head>
<body>
  <div id="sidebar">
    <a href="/index.html">← voltar ao jogo</a>
    <h3 style="margin: 4px 0;">Editor de Sprites</h3>
    <label>Tamanho (px)
      <input id="gridSize" type="number" value="16" min="4" max="64" />
    </label>
    <button id="resize">Redimensionar grade</button>
    <div class="palette" id="palette"></div>
    <input id="customColor" type="color" value="#e63946" />
    <button id="addColor">+ cor</button>
    <button id="clear">Limpar</button>
    <button id="importBtn">Importar imagem</button>
    <input id="fileInput" type="file" accept="image/*" style="display:none" />
    <button id="exportBtn">Exportar PNG</button>
  </div>
  <div id="canvasWrap">
    <canvas id="editor" width="512" height="512"></canvas>
  </div>
  <script type="module" src="/src/editor/main.ts"></script>
</body>
</html>
